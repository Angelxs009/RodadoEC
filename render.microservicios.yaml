# Blueprint de RodadoEc para Render (plan gratis): UN solo servicio web que aloja los 5 módulos en un proceso.
#
# Por qué un solo servicio: el proxy público de Render entrega las peticiones al servicio como HTTP/1.x, así que gRPC
# entre servicios web separados devuelve 502 (verificado). Aquí Catálogo, Pagos, Identidad y Reservas siguen siendo
# aplicaciones separadas (su módulo, su schema de base de datos y su servidor gRPC), y el gateway las llama por gRPC
# en 127.0.0.1 dentro del mismo contenedor. Solo el gateway expone el puerto público ($PORT).
# (La versión con 5 servicios independientes, para hosts con gRPC, está en render.distribuido.yaml.)
#
# BASE DE DATOS: este blueprint NO crea Postgres. Crea una gratis en Neon (neon.tech) y pega su URL (sin "-pooler")
# en DATABASE_URL. Cada módulo usa su propio schema dentro de esa base.

services:
  - type: web
    name: rodadoec-api
    runtime: docker
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - { key: APP, value: all }
      - { key: NODE_ENV, value: production }
      - { key: NODE_OPTIONS, value: "--max-old-space-size=360" }   # los 5 módulos en un proceso deben caber en 512 MB
      - { key: DATABASE_URL, sync: false }
      - { key: ADMIN_USERNAME, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: ADMIN_JWT_SECRET, generateValue: true }
      - { key: CUSTOMER_JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, value: "https://rodado-ec.vercel.app" }
      - { key: PUBLIC_ASSETS_URL, value: "https://rodado-ec.vercel.app" }
      - { key: AUTH_ENFORCE_ADMIN, value: "true" }      # el API es público: /admin exige JWT de ADMIN
      - { key: AUTH_ENFORCE_CUSTOMER, value: "false" }
      - { key: AUTH_ENFORCE_V2, value: "false" }        # "true" → rutas protegidas del contrato exigen JWT o X-API-Key
      - { key: NODE_ID, value: NODE_AUT_LOCAL }
      - { key: NODE_NAME, value: "RodadoEc (Flota Partner)" }
      # Opcionales (agrégalos en el panel si los necesitas): INVENTORY_REST_URL (respaldo REST del stock hacia Booking), INVENTORY_GRPC_URL, RABBITMQ_URL, KAFKA_BROKERS, BOOKING_API_KEY
